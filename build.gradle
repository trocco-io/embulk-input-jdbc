
plugins {
    id 'java'
    id 'checkstyle'
}

// NOTE: bintray (com.jfrog.bintray) and jcenter were both shut down; the
// com.github.jruby-gradle.base plugin used for the "gem" task also fails to resolve its
// own transitive dependency (grolifant) now that jcenter is gone. Both have been removed
// below so this repo can actually compile/test again. This fork's build output was not
// used anywhere prior to this change, so this carries zero risk to existing behavior.
// Gem packaging is done with a plain Exec task invoking the system `gem` command instead
// of JRubyExec (see the "gem" task below).

def embulkRuntimeJar = file("${rootDir}/vendor/embulk-0.9.25.jar")

task fetchEmbulkRuntime(type: Exec) {
    outputs.file(embulkRuntimeJar)
    commandLine 'sh', "${rootDir}/scripts/fetch_embulk_runtime.sh"
}

allprojects {
    group = 'org.embulk.input.jdbc'
    version = '0.10.0'
}

subprojects {
    apply plugin: 'maven'  // install jar files to the local repo: $ gradle install
    apply plugin: 'java'
    apply plugin: 'findbugs'
    apply plugin: 'checkstyle'
    //apply plugin: 'jacoco'

    repositories {
        mavenCentral()
    }

    configurations {
        provided
        defaultJdbcDriver
    }

    sourceCompatibility = 1.8
    targetCompatibility = 1.8

    dependencies {
        compile  files(embulkRuntimeJar)
        provided files(embulkRuntimeJar)
        testCompile 'junit:junit:4.+'
        testCompile 'org.mockito:mockito-core:4.+'
    }

    compileJava.dependsOn(rootProject.fetchEmbulkRuntime)
    compileTestJava.dependsOn(rootProject.fetchEmbulkRuntime)

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked" //<< "-Xlint:deprecation"
        options.encoding = 'UTF-8'
    }
    tasks.withType(FindBugs) {
        reports {
            xml.enabled = false
            html.enabled = true
        }
    }

    findbugs {
        ignoreFailures = true
    }

    javadoc {
        options {
            locale = 'en_US'
            encoding = 'UTF-8'
        }
    }

    test {
        // JDBC input plugins depend on local time zone to parse timestamp without time stamp and datetime types.
        jvmArgs "-Duser.country=FI", "-Duser.timezone=Europe/Helsinki"
        environment "TZ", "Europe/Helsinki"
    }

    task classpath(type: Copy, dependsOn: ["jar"]) {
        doFirst { file('classpath').deleteDir() }
        from (configurations.runtime - configurations.provided - configurations.defaultJdbcDriver + files(jar.archivePath))
        into 'classpath'
    }
    task defaultJdbcDriver(type: Copy, dependsOn: ["jar"]) {
        doFirst { file('default_jdbc_driver').deleteDir() }
        from (configurations.defaultJdbcDriver)
        into 'default_jdbc_driver'
    }
    clean {
        delete 'classpath'
        delete 'default_jdbc_driver'
    }

    checkstyle {
        configFile = file("${project.rootDir}/config/checkstyle/checkstyle.xml")
        toolVersion = '6.14.1'
    }
    checkstyleMain {
        configFile = file("${project.rootDir}/config/checkstyle/default.xml")
        ignoreFailures = true
    }
    checkstyleTest {
        configFile = file("${project.rootDir}/config/checkstyle/default.xml")
        ignoreFailures = true
    }
    task checkstyle(type: Checkstyle) {
        classpath = sourceSets.main.output + sourceSets.test.output
        source = sourceSets.main.allJava + sourceSets.test.allJava
    }

    task gem(type: Exec, dependsOn: ['build', 'gemspec', 'classpath', 'defaultJdbcDriver']) {
        doFirst { file("${parent.projectDir}/pkg").mkdirs() }
        workingDir project.projectDir
        // "gem build" chdirs into the gemspec file's own directory before evaluating it
        // (so that relative Dir[]/`git ls-files` paths inside the gemspec resolve against
        // that directory, and so the file-existence check it runs afterwards resolves
        // against that same directory too). The gemspec is therefore generated directly
        // in projectDir (not under build/), matching where classpath/, lib/ and src/
        // actually live.
        commandLine 'gem', 'build', "${project.projectDir.absolutePath}/.gemspec.generated",
                '--output', "${parent.projectDir.absolutePath}/pkg/${project.name}-${project.version}.gem"
    }

    javadoc {
        options {
            locale = 'en_US'
            encoding = 'UTF-8'
        }
    }

    // add tests/javadoc/source jar tasks as artifacts to be released
    task testsJar(type: Jar, dependsOn: classes) {
        classifier = 'tests'
        from sourceSets.test.output
    }
    task sourcesJar(type: Jar, dependsOn: classes) {
        classifier = 'sources'
        from sourceSets.main.allSource
    }
    task javadocJar(type: Jar, dependsOn: javadoc) {
        classifier = 'javadoc'
        from javadoc.destinationDir
    }
    artifacts {
        archives testsJar, sourcesJar, javadocJar
    }

    task gemspec {
        doLast {
            file('.gemspec.generated').write($/
Gem::Specification.new do |spec|
  spec.name          = "${project.name}"
  spec.version       = "${project.version}"
  spec.authors       = ["Sadayuki Furuhashi"]
  spec.summary       = %[JDBC input plugin for Embulk]
  spec.description   = %[Selects records from a table.]
  spec.email         = ["frsyuki@gmail.com"]
  spec.licenses      = ["Apache-2.0"]
  spec.homepage      = "https://github.com/trocco-io/embulk-input-jdbc"

  spec.files         = `git ls-files`.split("\n") + Dir["classpath/*.jar"] + Dir["default_jdbc_driver/*.jar"]
  spec.test_files    = spec.files.grep(%r"^(test|spec)/")
  spec.require_paths = ["lib"]
end
/$)
        }
    }
}

task gemPush {
    doLast {
        "gem push pkg/embulk-input-jdbc-${project.version}.gem".execute().waitFor()
        "gem push pkg/embulk-input-mysql-${project.version}.gem".execute().waitFor()
        "gem push pkg/embulk-input-postgresql-${project.version}.gem".execute().waitFor()
        "gem push pkg/embulk-input-redshift-${project.version}.gem".execute().waitFor()
        "gem push pkg/embulk-input-oracle-${project.version}.gem".execute().waitFor()
        "gem push pkg/embulk-input-sqlserver-${project.version}.gem".execute().waitFor()
        "gem push pkg/embulk-input-db2-${project.version}.gem".execute().waitFor()
    }
}
